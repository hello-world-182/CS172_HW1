[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cs172"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "matplotlib",
    "pillow",
    "tqdm",
    "torch",
    "torchvision",
]

[project.optional-dependencies]
tensorboard = ["tensorboard"]

[tool.black]
line-length = 120

[tool.setuptools.packages.find]
where = ["src"]
